# Every push and pull request: the Go server, the web app's pure modules (with
# the committed wasm) and the Rust engine's physics tests.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  app:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'internal/web/app/test/*.test.mjs'

  engine:
    name: Rust engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test --release --manifest-path engine/Cargo.toml
